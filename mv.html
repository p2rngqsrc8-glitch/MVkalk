<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>MV Kalkulators</title>
<style>
  body { font-family: Arial, sans-serif; margin: 10px; }
  h2 { margin-bottom: 10px; }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 5px;
    align-items: center;
  }

  .row input { 
    flex: 1 1 60px; 
    font-size: 22px; 
    text-align: center; 
    padding: 6px; 
  }

  .row button { 
    font-size: 22px; 
    padding: 6px 12px; 
  }

  #totals { margin-top: 10px; font-weight: bold; font-size: 22px; }

  /* Responsīvs fonts mazākos ekrānos */
  @media only screen and (max-width: 400px) {
    .row input { flex: 1 1 50px; font-size: 24px; }
    .row button { font-size: 24px; padding: 8px 14px; }
  }
</style>
</head>
<body>

<h2>MV Kalkulators</h2>

<div id="foodContainer">
  <div class="row">
    <input type="number" min="0" placeholder="Grami">
    <input type="number" min="0" placeholder="Carb">
    <input type="number" min="0" placeholder="Oglihi">
    <input type="number" min="0" placeholder="MV">
    <button onclick="deleteRow(this)">-</button>
    <button onclick="addRow(this)">+</button>
  </div>
</div>

<div id="totals">Kopā Carbs: 0 g | Kopā MV: 0</div>

<script>
const carbsPerMV = 12; // 1 MV = 12 g ogļhidrāti
const container = document.getElementById('foodContainer');

function addRow(btn) {
  const row = btn.parentElement;
  const newRow = row.cloneNode(true);
  newRow.querySelectorAll('input').forEach(input => input.value = '');
  container.appendChild(newRow);
  calculateTotals();
}

function deleteRow(btn) {
  const row = btn.parentElement;
  if(container.children.length > 1) {
    row.remove();
    calculateTotals();
  }
}

function calculateTotals() {
  let totalCarbs = 0;
  let totalMV = 0;

  container.querySelectorAll('.row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    const weight = parseFloat(inputs[0].value);
    const carbs100 = parseFloat(inputs[1].value);
    let oglihi = parseFloat(inputs[2].value);
    let mvValue = parseFloat(inputs[3].value);

    let carbs = 0;
    let mv = 0;

    if((isNaN(weight) || weight===0) && (isNaN(carbs100) || carbs100===0) && !isNaN(mvValue) && mvValue>0) {
      mv = mvValue;
      carbs = mv * carbsPerMV;
      oglihi = carbs;
    } else if(!isNaN(weight) && !isNaN(carbs100)) {
      carbs = weight * carbs100 / 100;
      oglihi = carbs;
      mv = carbs / carbsPerMV;
    }

    inputs[2].value = oglihi ? oglihi.toFixed(1) : '';
    inputs[3].value = mv ? mv.toFixed(1) : '';

    totalCarbs += carbs || 0;
    totalMV += mv || 0;
  });

  document.getElementById('totals').innerText = `Kopā Carbs: ${totalCarbs.toFixed(1)} g | Kopā MV: ${totalMV.toFixed(1)}`;
}

// Recalculate totals on input
container.addEventListener('input', calculateTotals);
calculateTotals();
</script>

</body>
</html>
