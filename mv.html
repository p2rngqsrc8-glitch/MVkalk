<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>MV Kalkulators</title>
<style>
  body { font-family: Arial, sans-serif; margin: 10px; }
  table { border-collapse: collapse; width: 100%; font-size:14px; table-layout:auto; }
  th, td { border: 1px solid #ccc; text-align: center; padding: 2px 4px; white-space: nowrap; }
  input { width: 50px; text-align: center; }
  button { padding: 2px 6px; margin: 0 1px; }
  #totals { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h2>MV Kalkulators</h2>
<table id="foodTable">
  <thead>
    <tr>
      <th>Grami</th>
      <th>Carb</th>
      <th>Oglihi</th>
      <th>MV</th>
      <th>Act</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><input type="number" min="0" placeholder="g"></td>
      <td><input type="number" min="0" placeholder="c/100g"></td>
      <td><input type="number" min="0" placeholder="g"></td>
      <td><input type="number" min="0" placeholder="MV"></td>
      <td>
        <button onclick="deleteRow(this)">-</button>
        <button onclick="addRow(this)">+</button>
      </td>
    </tr>
  </tbody>
</table>

<div id="totals">Kopā Carbs: 0 g | Kopā MV: 0</div>

<script>
const carbsPerMV = 12; // 1 MV = 12 g ogļhidrāti
const table = document.getElementById('foodTable').getElementsByTagName('tbody')[0];

function addRow(btn) {
  const row = btn.parentElement.parentElement;
  const newRow = row.cloneNode(true);
  newRow.querySelectorAll('input').forEach(input => input.value = '');
  table.appendChild(newRow);
  calculateTotals();
}

function deleteRow(btn) {
  const row = btn.parentElement.parentElement;
  if(table.rows.length > 1) {
    row.remove();
    calculateTotals();
  }
}

function calculateTotals() {
  let totalCarbs = 0;
  let totalMV = 0;

  table.querySelectorAll('tr').forEach(row => {
    const cells = row.querySelectorAll('input');
    const weight = parseFloat(cells[0].value);
    const carbs100 = parseFloat(cells[1].value);
    let oglihi = parseFloat(cells[2].value);
    let mvValue = parseFloat(cells[3].value);

    let carbs = 0;
    let mv = 0;

    if((isNaN(weight) || weight===0) && (isNaN(carbs100) || carbs100===0) && !isNaN(mvValue) && mvValue>0) {
      // Ja svars un carbs tukši, bet MV ierakstīts
      mv = mvValue;
      carbs = mv * carbsPerMV;
      oglihi = carbs; // parādām kopējo carbs
    } else if(!isNaN(weight) && !isNaN(carbs100)) {
      carbs = weight * carbs100 / 100;
      oglihi = carbs;
      mv = carbs / carbsPerMV;
    }

    cells[2].value = oglihi ? oglihi.toFixed(1) : '';
    cells[3].value = mv ? mv.toFixed(1) : '';

    totalCarbs += carbs || 0;
    totalMV += mv || 0;
  });

  document.getElementById('totals').innerText = `Kopā Carbs: ${totalCarbs.toFixed(1)} g | Kopā MV: ${totalMV.toFixed(1)}`;
}

// Recalculate totals on input change
table.addEventListener('input', calculateTotals);

// Initialize totals
calculateTotals();
</script>

</body>
</html>
