<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>MV Kalkulators Vertikāli</title>
<style>
  body { font-family: Arial, sans-serif; margin: 10px; }
  h2 { margin-bottom: 10px; }

  .item {
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .item label { font-size: 20px; }
  .item input { font-size: 22px; padding: 6px; text-align: center; }

  .buttons {
    display: flex;
    justify-content: flex-start;
    gap: 10px;
  }

  .buttons button { font-size: 22px; padding: 6px 12px; }

  #totals { margin-top: 10px; font-weight: bold; font-size: 22px; }

  @media only screen and (max-width: 400px) {
    .item input { font-size: 24px; }
    .buttons button { font-size: 24px; padding: 8px 14px; }
  }
</style>
</head>
<body>

<h2>MV Kalkulators Vertikāli</h2>

<div id="foodContainer"></div>

<div id="totals">Kopā Carbs: 0 g | Kopā MV: 0</div>

<script>
const carbsPerMV = 12;
const container = document.getElementById('foodContainer');
const storageKey = 'mvData';

// Izveido jaunu vertikālu item
function createItem(data={weight:'', carbs100:'', oglihi:'', mv:''}) {
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `
    <label>Grami: <input type="number" min="0" placeholder="g" value="${data.weight}"></label>
    <label>Carb: <input type="number" min="0" placeholder="c/100g" value="${data.carbs100}"></label>
    <label>Oglihi: <input type="number" min="0" placeholder="g" value="${data.oglihi}"></label>
    <label>MV: <input type="number" min="0" placeholder="MV" value="${data.mv}"></label>
    <div class="buttons">
      <button onclick="deleteItem(this)">-</button>
      <button onclick="addItem(this)">+</button>
    </div>
  `;
  container.appendChild(div);
}

// Pievieno jaunu item
function addItem(btn) {
  createItem();
  calculateTotals();
  saveData();
}

// Dzēš item
function deleteItem(btn) {
  const item = btn.closest('.item');
  if(container.children.length > 1) {
    item.remove();
    calculateTotals();
    saveData();
  }
}

// Aprēķina Carbs un MV
function calculateTotals() {
  let totalCarbs = 0;
  let totalMV = 0;

  container.querySelectorAll('.item').forEach(item => {
    const inputs = item.querySelectorAll('input');
    const weight = parseFloat(inputs[0].value);
    const carbs100 = parseFloat(inputs[1].value);
    let oglihi = parseFloat(inputs[2].value);
    let mvValue = parseFloat(inputs[3].value);

    let carbs = 0;
    let mv = 0;

    // Ja tikai MV ir ievadīts
    if((isNaN(weight) || weight===0) && (isNaN(carbs100) || carbs100===0) && !isNaN(mvValue) && mvValue>0) {
      mv = mvValue;
      carbs = mv * carbsPerMV;
      oglihi = carbs;
    } 
    // Ja ievadīti Grami un Carb/100g
    else if(!isNaN(weight) && !isNaN(carbs100)) {
      carbs = weight * carbs100 / 100;
      oglihi = carbs;
      mv = carbs / carbsPerMV;
    }

    inputs[2].value = oglihi ? oglihi.toFixed(1) : '';
    inputs[3].value = mv ? mv.toFixed(1) : '';

    totalCarbs += carbs || 0;
    totalMV += mv || 0;
  });

  document.getElementById('totals').innerText = `Kopā Carbs: ${totalCarbs.toFixed(1)} g | Kopā MV: ${totalMV.toFixed(1)}`;
  saveData();
}

// Saglabā localStorage
function saveData() {
  const data = [];
  container.querySelectorAll('.item').forEach(item => {
    const inputs = item.querySelectorAll('input');
    data.push({
      weight: inputs[0].value,
      carbs100: inputs[1].value,
      oglihi: inputs[2].value,
      mv: inputs[3].value
    });
  });
  localStorage.setItem(storageKey, JSON.stringify(data));
}

// Ielādē localStorage
function loadData() {
  const data = JSON.parse(localStorage.getItem(storageKey) || '[]');
  if(data.length === 0) {
    createItem();
  } else {
    data.forEach(d => createItem(d));
  }
  calculateTotals();
}

// Recalculate on input change
container.addEventListener('input', () => {
  calculateTotals();
  saveData();
});

// Inicializācija
loadData();
</script>

</body>
</html>
