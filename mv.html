<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MV kalkulators</title>
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding: 20px;
  background: #f4f4f4;
}
input {
  width: 80px;
  padding: 4px;
  font-size: 16px;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}
td, th {
  border: 1px solid #ddd;
  padding: 6px;
  text-align: center;
}
button {
  padding: 4px 8px;
  font-size: 16px;
}
h2, h3 {
  margin-top: 15px;
}
</style>
</head>
<body>

<h2>Maizes vienību kalkulators</h2>

<label>1 MV = 
  <input id="mvFactor" type="number" value="12" oninput="calc(); save()" style="width:60px;">
  g ogļhidrātu
</label>

<br><br>

<table id="tbl">
<tr>
<th>Grami</th>
<th>Carbs/100g</th>
<th>Ogļhidrāti</th>
<th>MV</th>
<th></th>
</tr>
</table>

<h3>Kopā: <span id="totalMV">0</span> MV</h3>

<label>Insulīna koeficients (U/MV):
  <input id="insulinCoef" type="number" value="1" oninput="calc(); save()" style="width:60px;">
</label>

<h3>Ieteiktais boluss: <span id="bolus">0</span> U</h3>

<script>
function addRow(index, grams="", carbs100="") {
  let table = document.getElementById("tbl");
  let row = table.insertRow(index);

  let g = row.insertCell(0);
  let c = row.insertCell(1);
  let carbs = row.insertCell(2);
  let mv = row.insertCell(3);
  let actions = row.insertCell(4);

  g.innerHTML = `<input type="number" placeholder="100" value="${grams}" oninput="calc(); save()">`;
  c.innerHTML = `<input type="number" placeholder="40" value="${carbs100}" oninput="calc(); save()">`;
  carbs.innerText = "0";
  mv.innerText = "0";

  actions.innerHTML = `
    <button onclick="addRow(this.parentNode.parentNode.rowIndex + 1)">+</button>
    <button onclick="deleteRow(this)">−</button>
  `;

  calc();
  save();
}

function deleteRow(btn) {
  let row = btn.parentNode.parentNode;
  let table = document.getElementById("tbl");
  table.deleteRow(row.rowIndex);
  if (table.rows.length === 1) { // ja nav nevienas rindu, pievieno tukšu
    addRow(1);
  }
  calc();
  save();
}

function calc() {
  let table = document.getElementById("tbl");
  let totalMV = 0;
  let mvFactor = parseFloat(document.getElementById("mvFactor").value) || 12;
  let insulinCoef = parseFloat(document.getElementById("insulinCoef").value) || 1;

  for (let r = 1; r < table.rows.length; r++) {
    let grams = parseFloat(table.rows[r].cells[0].children[0].value) || 0;
    let carbs100 = parseFloat(table.rows[r].cells[1].children[0].value) || 0;

    let carbs = (grams * carbs100) / 100;
    let mv = carbs / mvFactor;

    table.rows[r].cells[2].innerText = carbs.toFixed(1);
    table.rows[r].cells[3].innerText = mv.toFixed(2);

    totalMV += mv;
  }

  document.getElementById("totalMV").innerText = totalMV.toFixed(2);
  document.getElementById("bolus").innerText = (totalMV * insulinCoef).toFixed(1);
}

function save() {
  let rows = [];
  let table = document.getElementById("tbl");

  for (let r = 1; r < table.rows.length; r++) {
    rows.push({
      grams: table.rows[r].cells[0].children[0].value,
      carbs100: table.rows[r].cells[1].children[0].value
    });
  }

  localStorage.setItem("mvRows", JSON.stringify(rows));
  localStorage.setItem("mvFactor", document.getElementById("mvFactor").value);
  localStorage.setItem("insulinCoef", document.getElementById("insulinCoef").value);
}

function load() {
  let savedRows = JSON.parse(localStorage.getItem("mvRows") || "[]");

  document.getElementById("mvFactor").value =
    localStorage.getItem("mvFactor") || 12;

  document.getElementById("insulinCoef").value =
    localStorage.getItem("insulinCoef") || 1;

  if (savedRows.length === 0) {
    addRow(1);
  } else {
    for (let i = 0; i < savedRows.length; i++) {
      addRow(i + 1, savedRows[i].grams, savedRows[i].carbs100);
    }
  }
}

load();
</script>

</body>
</html>
